<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOM 对比工具</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>BOM 对比工具</h1>
      <p class="subtitle">对比两个 BOM 文件的位号与料号差异</p>
    </header>

    <section class="file-section">
      <div class="file-row">
        <button class="btn btn-select" data-target="1">选择 BOM 1</button>
        <div class="file-input" id="file1-input">
          <span class="placeholder">尚未选择 BOM 1 文件</span>
        </div>
      </div>
      <div class="file-row">
        <button class="btn btn-select" data-target="2">选择 BOM 2</button>
        <div class="file-input" id="file2-input">
          <span class="placeholder">尚未选择 BOM 2 文件</span>
        </div>
      </div>
    </section>

    <section class="action-section">
      <button class="btn btn-primary" id="compare-btn">开始对比</button>
    </section>

    <section class="result-section" id="result-section" hidden>
      <div class="result-header">
        <h2>对比结果</h2>
        <button class="btn btn-link" id="save-report-btn" hidden>保存报告文件</button>
      </div>

      <div class="summary-cards">
        <div class="card card-changed">
          <div class="card-num" id="count-changed">0</div>
          <div class="card-label">料号变更</div>
        </div>
        <div class="card card-only1">
          <div class="card-num" id="count-only1">0</div>
          <div class="card-label">仅 BOM 1</div>
        </div>
        <div class="card card-only2">
          <div class="card-num" id="count-only2">0</div>
          <div class="card-label">仅 BOM 2</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="changed">料号变更</button>
        <button class="tab" data-tab="only1">仅 BOM 1</button>
        <button class="tab" data-tab="only2">仅 BOM 2</button>
      </div>

      <div class="table-wrap">
        <table class="result-table">
          <thead>
            <tr>
              <th class="col-idx">#</th>
              <th class="col-loc">Location</th>
              <th class="col-pn">BOM 1 料号</th>
              <th class="col-pn">BOM 2 料号</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
